      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function scales based on demand"
    Properties:
      FunctionName: !Sub "${StackName}-apollo-sync-bda"
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ../appsync/src/lambda/sync_bda_idp_resolver/
      MemorySize: 256
      Timeout: 60
      Layers:
        - !Ref IDPCommonBaseLayerArn
      LoggingConfig:
        LogGroup: !Ref SyncBdaIdpResolverFunctionLogGroup
      Environment:
        Variables:
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTableName
          CONFIGURATION_BUCKET_NAME: !Ref ConfigurationBucketName
          LOG_LEVEL: !Ref LogLevel
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTableName
        - S3CrudPolicy:
            BucketName: !Ref ConfigurationBucketName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:*DataAutomationProject*
                - bedrock:ListDataAutomationProjects
                - bedrock:GetDataAutomationProject
              Resource: "*"
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn

  ListDocumentsByDateRangeResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  ListDocumentsByDateRangeResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function scales based on demand"
    Properties:
      FunctionName: !Sub "${StackName}-apollo-list-doc-range"
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ../appsync/src/lambda/list_documents_range_resolver/
      MemorySize: 256
      Timeout: 30
      Layers:
        - !Ref IDPCommonBaseLayerArn
      LoggingConfig:
        LogGroup: !Ref ListDocumentsByDateRangeResolverFunctionLogGroup
      Environment:
        Variables:
          TRACKING_TABLE_NAME: !Ref TrackingTableName
          LOG_LEVEL: !Ref LogLevel
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrackingTableName
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn

  ListDocumentsGSIResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  ListDocumentsGSIResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function scales based on demand"
    Properties:
      FunctionName: !Sub "${StackName}-apollo-list-doc-gsi"
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ../appsync/src/lambda/list_documents_gsi_resolver/
      MemorySize: 256
      Timeout: 30
      Layers:
        - !Ref IDPCommonBaseLayerArn
      LoggingConfig:
        LogGroup: !Ref ListDocumentsGSIResolverFunctionLogGroup
      Environment:
        Variables:
          TRACKING_TABLE_NAME: !Ref TrackingTableName
          LOG_LEVEL: !Ref LogLevel
          USERS_TABLE_NAME: !Ref UsersTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrackingTableName
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
        - !If
          - HasUsersTable
          - DynamoDBReadPolicy:
              TableName: !Ref UsersTableName
          - !Ref AWS::NoValue

Outputs:
  HttpApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
    Description: Apollo GraphQL HTTP API URL

  HttpApiBackendUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/graphql/backend"
    Description: Apollo GraphQL HTTP API URL for backend callers (API key auth)

  WebSocketApiUrl:
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod"
    Description: WebSocket API URL for GraphQL subscriptions

  WebSocketPublisherFunctionArn:
    Value: !GetAtt WebSocketPublisherFunction.Arn
    Description: ARN of the WebSocket Publisher function (for direct invocation by backend)

  BackendApiKeySecretArn:
    Value: !Ref BackendApiKeySecret
    Description: Secrets Manager ARN for the backend API key
